<!DOCTYPE html>
<html lang="en" data-i18n-title="admin.subscriptionPlanPageTitle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendFlix · Subscription Plan</title>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script defer src="/assets/js/i18n.js"></script>
    <script defer src="/assets/js/admin-shared.js"></script>
    <script defer src="/assets/js/admin-subscription-plan.js"></script>
  </head>
  <body class="admin-page">
    <div class="page-tools">
      <div class="lang-menu">
        <button class="lang-trigger" type="button" data-lang-trigger data-i18n-aria-label="common.language" aria-expanded="false">🌐</button>
        <div class="lang-menu-list" data-lang-menu>
          <button class="lang-option" type="button" data-set-lang="en" data-i18n="common.english">English</button>
          <button class="lang-option" type="button" data-set-lang="ar" data-i18n="common.arabic">Arabic</button>
        </div>
      </div>
    </div>

    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow" data-i18n="admin.eyebrow">Admin Dashboard</p>
          <h1 class="brand" data-i18n="admin.subscriptionPlanHeading">Subscription Plan</h1>
          <p class="admin-subtitle" data-i18n="admin.subscriptionPlanSubtitle">Manage the single subscription plan pricing and settings.</p>
        </div>
        <div class="admin-actions">
          <a class="ghost-link" href="/pages/admin.html" data-i18n="admin.backToDashboard">Back to Dashboard</a>
        </div>
      </header>

      <p id="pageError" class="notice error-notice" hidden></p>

      <section class="dashboard-grid single-col">
        <article class="card panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker" data-i18n="admin.subscriptionPlanKicker">Subscription</p>
              <h2 data-i18n="admin.subscriptionPlanTitle">Update Plan</h2>
            </div>
          </div>

          <form id="planForm" class="form-stack">
            <label class="field">
              <span data-i18n="admin.subscriptionPlanName">Plan Name</span>
              <input id="planName" name="name" type="text" required />
            </label>
            <div class="field-row-admin">
              <label class="field">
                <span data-i18n="admin.subscriptionPlanPrice">Price</span>
                <input id="planPrice" name="price" type="number" min="0.01" step="0.01" required />
              </label>
              <label class="field">
                <span data-i18n="admin.subscriptionPlanCurrency">Currency</span>
                <input id="planCurrency" name="currency" type="text" maxlength="3" required placeholder="USD" />
              </label>
            </div>
            <label class="field">
              <span data-i18n="admin.subscriptionPlanBillingPeriod">Billing Period (days)</span>
              <input id="planBillingDays" name="billing_period_days" type="number" min="1" required />
            </label>
            <label class="field-inline">
              <input id="planIsActive" name="is_active" type="checkbox" />
              <span data-i18n="admin.subscriptionPlanActive">Plan is active</span>
            </label>
            <button class="btn primary" id="savePlanBtn" type="submit" data-i18n="admin.subscriptionPlanSave">Save Plan</button>
            <p id="planStatus" class="notice" hidden></p>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
