<!DOCTYPE html>
<html lang="en" data-i18n-title="communities.communitiesPageTitle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendFlix · Communities</title>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/communities.css" />
    <script defer src="/assets/js/i18n.js"></script>
    <script defer src="/assets/js/communities-api.js"></script>
    <script defer src="/assets/js/communities-ui.js"></script>
    <script defer src="/assets/js/communities.js"></script>
  </head>
  <body>
    <div class="comm-shell">
      <nav class="comm-topbar">
        <a class="comm-back" href="/pages/app.html" data-i18n="communities.backToHome">← Back to Home</a>
        <span class="comm-brand">TrendFlix</span>
        <div class="comm-topbar-right">
          <a class="comm-btn comm-btn-primary" href="/pages/create-community.html" data-i18n="communities.createCommunity">+ Create Community</a>
          <div class="lang-menu">
            <button class="lang-trigger" type="button" data-lang-trigger data-i18n-aria-label="common.language" aria-expanded="false">🌐</button>
            <div class="lang-menu-list" data-lang-menu>
              <button class="lang-option" type="button" data-set-lang="en" data-i18n="common.english">English</button>
              <button class="lang-option" type="button" data-set-lang="ar" data-i18n="common.arabic">Arabic</button>
            </div>
          </div>
        </div>
      </nav>

      <header class="comm-hero">
        <h1 data-i18n="communities.cHeading">Communities</h1>
        <p class="comm-subtitle" data-i18n="communities.cSubtitle">
          Join clubs for movies, series, books, and games. Share posts, reviews, and discussions with people who love what you love.
        </p>
      </header>

      <div class="comm-toolbar">
        <div class="comm-search">
          <input id="searchInput" type="search" data-i18n-placeholder="communities.cSearchPlaceholder" placeholder="Search communities..." autocomplete="off" />
        </div>
      </div>

      <p class="comm-section-title" data-i18n="communities.cPopular">Popular</p>
      <div id="popularGrid" class="comm-grid">
        <p class="comm-status" data-i18n="communities.cLoadingPopular">Loading popular communities...</p>
      </div>

      <p class="comm-section-title" style="margin-top:34px" data-i18n="communities.cAllCommunities">All Communities</p>
      <div id="allGrid" class="comm-grid">
        <p class="comm-status" data-i18n="communities.cLoadingAll">Loading communities...</p>
      </div>
    </div>
  </body>
</html>
